<script>
/* 星間飛行（2026-11-17）: ON -> data-theme="dark", OFF -> "light". Key wuwa-star = on|off; old wuwa-theme (dark|light) is migrated; no stored value -> prefers-color-scheme */
(function () {
  var v = null;
  try { v = localStorage.getItem('wuwa-star'); if (!v) { var o = localStorage.getItem('wuwa-theme'); v = o === 'dark' ? 'on' : o === 'light' ? 'off' : null; } } catch (e) {}
  if (v !== 'on' && v !== 'off') v = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'on' : 'off';
  document.documentElement.dataset.theme = v === 'on' ? 'dark' : 'light';
})();
</script>
